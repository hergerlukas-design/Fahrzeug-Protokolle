name: Daily Monitoring Agent

on:
  schedule:
    # Täglich um 00:00 UTC (= 02:00 CEST / 01:00 CET)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Manuell triggerbar

jobs:
  monitoring:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Monitoring Agent via Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Claude Code Aktion wird mit diesem Prompt aufgerufen
          # Die GitHub Secrets werden als Environment Variables übergeben
          prompt: |
            Du bist der Monitoring Agent für Lukas' PWA Portfolio.

            **WICHTIG: Du hast Zugriff auf diese Environment Variables:**
            - FLY_IO_API_TOKEN (für Fly.io API)
            - SUPABASE_API_TOKEN (für Supabase API)

            **Deine Aufgabe (täglich um 00:00 UTC):**

            1. **Fly.io Logs abrufen** (letzte 24h)
               - Nutze curl oder Python requests mit FLY_IO_API_TOKEN
               - API: https://api.fly.io/graphql (GraphQL)
               - Filtere nach HTTP 5xx Status Codes
               - Extrahiere: Timestamp, Status, Path, Message

            2. **Supabase Logs abrufen** (letzte 24h)
               - API: https://api.supabase.com/v1/projects/{project_id}/analytics/logs
               - Header: Authorization: Bearer {SUPABASE_API_TOKEN}
               - Filtere nach Errors
               - Extrahiere: Timestamp, Query, Duration, Error

            3. **Error Analyse**
               - Kombiniere Fly.io + Supabase Errors
               - Gruppiere pro Projekt
               - Klassifiziere Severity (HIGH/MEDIUM/LOW)
               - Zähle Errors pro Projekt

            4. **GitHub Issues erstellen** (nur wenn Errors > 0)
               Für JEDES Projekt mit Errors:

               ```markdown
               Title: [AUTOMATED] 5xx Errors in <project-name>
               Labels: bug, automated, monitoring

               ## Error Summary
               - Project: <name>
               - Time Window: Last 24h (UTC)
               - Total Errors: <count>
               - Severity: <LEVEL>

               ## Sample Errors (Top 3)
               - [2026-10-02T15:23:45Z] 502 Bad Gateway - GET /api/vehicles
               - [2026-10-02T14:12:30Z] 503 Service Unavailable - POST /api/tours

               ## Error Details
               ### Fly.io Errors
               - [list all unique errors]

               ### Supabase Errors
               - [list database errors]

               ---
               **Auto-generated by Monitoring Agent**
               Next step: @claude will investigate
               ```

            5. **Email Notification** (optional - via GitHub Actions)
               Falls Errors > 0:
               - Subject: 🚨 Monitoring Alert: <ProjectName> - <Count> Errors
               - Body: Mit Link zu GitHub Issue

            6. **Token & Cost Tracking**
               - Zähle Tokens dieser Session
               - Berechne geschätzte Kosten
               - Gib finalen Report aus:

               ```
               📊 Monitoring Agent Report - 2026-10-02

               Projects Scanned: 4
               Total Errors: X
               Issues Created: Y
               Token Usage: ~Z tokens (~€0.00XY)
               Status: ✓ Complete

               Errors by Project:
               - ADE Fleet Manager: 0
               - CLX Fleetmanager: 0
               - LogDrive: 0
               - MP Scanner: 0
               ```

            7. **Error Handling**
               - API-Fehler? Log detailliert, continue
               - Keine Errors? Gib kurze Meldung: "All PWAs healthy ✓"
               - GitHub API Error? Retry bis 3x

            **Wichtige Hinweise:**
            - Nutze `os.getenv()` oder `${{ env.VAR }}` für Secrets
            - Schreib Issues NUR wenn Errors > 0 (kein Spam)
            - Dedupliziere: Nicht doppelte Issues für gleiche Errors
            - Timestamp Format: ISO 8601

            **Projekte zu monitoren:**
            - ADE Fleet Manager (ade-fleet-manager)
            - CLX Fleetmanager (clx-fleetmanager)
            - LogDrive (logdrive-pwa)
            - MP Scanner (ch-scanner)

            Starte jetzt die Monitoring! Viel Erfolg! 🚀

        env:
          # GitHub Secrets als Environment Variables übergeben
          FLY_IO_API_TOKEN: ${{ secrets.FLY_IO_API_TOKEN }}
          SUPABASE_API_TOKEN: ${{ secrets.SUPABASE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "✅ Monitoring Agent Workflow completed"
          echo "Next run: Tomorrow at 00:00 UTC"
